name: Feature request
description: Suggest something the package should do.
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that the package makes hard today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What you have in mind
      description: The API, config, or behaviour you would expect.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
